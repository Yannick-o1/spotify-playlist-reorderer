name: Shuffle Stuff every three days

on:
  workflow_dispatch:
  schedule:
    # Daily continuations finish one new three-day target within Spotify's write quota.
    - cron: "17 1 * * *"

concurrency:
  group: spotify-stuff-v2
  cancel-in-progress: false

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check source
        run: npm run check
      - name: Reorder playlist
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.STUFF_SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.STUFF_SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.STUFF_SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.STUFF_SPOTIFY_PLAYLIST_ID }}
          MAX_MOVES_PER_RUN: "470"
          ORDER_SEED_PREFIX: "stuff-v2"
          REVERSE_CHRONOLOGICAL_PERCENTAGE: "85"
          PINNED_ITEM_URIS: "spotify:track:2USTVgd20XRLMAhiYNklN8,spotify:track:5ju3Mgd15jLIAmZLwLPlwY,spotify:track:2073QOEC8rBtSyTsRyaWiP,spotify:track:2J4lJMCuFCA0zlwFOjePD5"
        run: npm start
